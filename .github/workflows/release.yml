name: Release Pipeline

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run Tests
        run: |
          pytest

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Build Metadata
        run: |
          echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV
          echo "REPO_LOWER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "SHORT_SHA=$(echo ${GITHUB_SHA} | cut -c1-7)" >> $GITHUB_ENV

      - name: Build and Push Docker Image
        run: |
          docker build \
            --label "org.opencontainers.image.title=student-ml-api" \
            --label "org.opencontainers.image.version=${{ env.VERSION }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.created=${{ env.BUILD_DATE }}" \
            -t ghcr.io/${{ env.REPO_LOWER }}/student-ml-api:${{ env.VERSION }} \
            -t ghcr.io/${{ env.REPO_LOWER }}/student-ml-api:latest \
            -t ghcr.io/${{ env.REPO_LOWER }}/student-ml-api:${{ env.SHORT_SHA }} .
          
          docker push ghcr.io/${{ env.REPO_LOWER }}/student-ml-api:${{ env.VERSION }}
          docker push ghcr.io/${{ env.REPO_LOWER }}/student-ml-api:latest
          docker push ghcr.io/${{ env.REPO_LOWER }}/student-ml-api:${{ env.SHORT_SHA }}